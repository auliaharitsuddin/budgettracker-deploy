server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Liveness/readiness probe for Docker, compose, and any orchestrator.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # index.html must never be cached, or users get a stale app after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Single-page app: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # No Content-Security-Policy on purpose: the app loads Chart.js from
    # jsdelivr and Tesseract.js from unpkg, and Tesseract additionally pulls a
    # worker (blob:), a wasm core, and language data at runtime. A CSP tight
    # enough to be useful breaks receipt OCR. Vendor those two libraries into
    # public/ first, then add a CSP here.

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
}
