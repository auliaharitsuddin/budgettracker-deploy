# Reusable workflow: Stage 1-4 from docs/PIPELINE-SPEC.md.
#
# Called by both ci.yml (on every PR / push to a non-main branch) and
# release.yml (on push to main, before Stage 5-9 run). Kept as a single
# reusable workflow so the two callers can never drift out of sync — a PR
# that passed this suite is *exactly* what release.yml re-verifies before
# deploying, not a similar-looking copy of it.
name: test-suite

on:
  workflow_call:
    outputs:
      image-size-bytes:
        description: "Uncompressed image size in bytes, for the release job summary"
        value: ${{ jobs.build-scan.outputs.image-size-bytes }}

permissions:
  contents: read

jobs:
  # ───────────────────────────── Stage 1 ─────────────────────────────
  # Static analysis. Nothing here needs the Docker daemon or a running
  # container; it only reads the working tree.
  lint:
    name: "Stage 1: static analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans full history, not just this commit

      # 1.1 hadolint — Dockerfile best practices (pinned base image, USER set, ...)
      # --failure-threshold warning: hadolint's default threshold is `info`,
      # which fails on stylistic notes and would make this gate noisier than
      # it is useful. Warnings and errors still block.
      - name: hadolint (Dockerfile)
        run: |
          docker run --rm -i hadolint/hadolint:latest \
            hadolint --failure-threshold warning - < Dockerfile

      # 1.2 actionlint — workflow syntax and expression correctness
      - name: actionlint (workflow files)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      # 1.3 yamllint — docker-compose.yml and every workflow file
      - name: yamllint (YAML syntax)
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint.yml docker-compose.yml .github/workflows/

      # 1.4 shellcheck — smoke.sh and the release scripts
      # Preinstalled on the ubuntu-latest runner image; the apt-get line is
      # a fallback in case that ever changes.
      - name: shellcheck (shell scripts)
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          shellcheck tests/smoke.sh scripts/*.sh

      # 1.5 gitleaks — no secrets anywhere in history. Run the OSS binary
      # directly (not the marketplace action) to avoid any license-key
      # requirement; the scanning engine itself is Apache-2.0 and free to
      # invoke however you like.
      # The GIT_CONFIG_* vars mark /repo as a safe directory inside the
      # container: the checkout is owned by the runner user, gitleaks runs as
      # root, and git otherwise aborts with "detected dubious ownership"
      # before scanning a single commit.
      - name: gitleaks (secret scan)
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner -v

      # 1.6 nginx -t — catches a typo in nginx.conf that would otherwise
      # only surface as "container failed to start" much later, in Stage 3.
      - name: nginx -t (config syntax)
        run: |
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.27-alpine \
            nginx -t

      # 1.7 tidy — public/index.html parses without a fatal HTML error.
      # Warnings are fine (this file predates strict HTML5 conventions);
      # only a fatal parse error should block the pipeline.
      - name: tidy (HTML validity)
        run: |
          sudo apt-get install -y tidy
          set +e
          tidy -errors -quiet public/index.html
          status=$?
          set -e
          # tidy exit codes: 0 = no problems, 1 = warnings only, 2 = errors.
          if [ "$status" -ge 2 ]; then
            echo "::error::tidy found fatal HTML errors in public/index.html"
            exit 1
          fi
          echo "tidy: no fatal errors (exit=$status)"

      # 1.8 deploybot drift check (deferred — see docs/PIPELINE-SPEC.md
      # Stage 1 notes). deploybot lives in a separate repository; this only
      # makes sense once that repo exists on GitHub and is reachable here.
      # Set the repo variable DEPLOYBOT_REPO (Settings -> Secrets and
      # variables -> Actions -> Variables) to `owner/deploybot` to enable it.
      - name: checkout deploybot (only if DEPLOYBOT_REPO is set)
        if: ${{ vars.DEPLOYBOT_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPLOYBOT_REPO }}
          path: _deploybot

      - name: deploybot drift check (only if DEPLOYBOT_REPO is set)
        if: ${{ vars.DEPLOYBOT_REPO != '' }}
        continue-on-error: true  # never let a cross-repo tool block this repo's release
        run: |
          python3 _deploybot/deploybot.py generate . --offline --write --force
          git diff --exit-code -- Dockerfile .dockerignore docker-compose.yml .github/workflows/ci.yml || {
            echo "::warning::generated artefacts drifted from deploybot's templates — see the diff above"
            exit 1
          }

  # ───────────────────────────── Stage 2 ─────────────────────────────
  # Build the image once, scan it, and export it as an artifact so every
  # later stage (and, from release.yml, the actual publish step) tests and
  # ships the exact same bytes instead of rebuilding and hoping nothing
  # drifted in between.
  build-scan:
    name: "Stage 2: build & scan image"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # to upload the Trivy SARIF report
    outputs:
      image-size-bytes: ${{ steps.size.outputs.bytes }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (exported to a tarball, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: budgettracker:ci
          outputs: type=docker,dest=/tmp/budgettracker.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load the built image into the local daemon
        run: docker load --input /tmp/budgettracker.tar

      # 2.3 Size budget. nginx-alpine + one HTML file should be nowhere
      # near this; a sudden jump means .dockerignore is leaking something
      # (.git, node_modules, a stray .docx) into the image.
      - name: Enforce image size budget (<= 80 MB uncompressed)
        id: size
        run: |
          bytes=$(docker image inspect budgettracker:ci --format='{{.Size}}')
          mb=$(( bytes / 1024 / 1024 ))
          echo "image size: ${bytes} bytes (~${mb} MB)"
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"
          limit=$((80 * 1024 * 1024))
          if [ "$bytes" -gt "$limit" ]; then
            echo "::error::image is ${mb} MB, budget is 80 MB — check .dockerignore for a leak"
            exit 1
          fi

      # 2.4 Trivy — fail the build on HIGH/CRITICAL vulnerabilities that
      # already have a fix available. Two passes: one machine-readable
      # (uploaded to the Security tab, never fails the job by itself) and
      # one human-readable pass that is the actual gate.
      - name: Trivy scan (SARIF, for the Security tab)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output /out/trivy-results.sarif \
            budgettracker:ci

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy scan (gate — fails on fixable HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            budgettracker:ci

      # 2.5 SBOM — recorded for traceability, not a pass/fail gate.
      - name: Generate SBOM (SPDX, via syft)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            anchore/syft:latest budgettracker:ci -o spdx-json=/out/sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

      - name: Upload built image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/budgettracker.tar
          retention-days: 1  # only needed for the rest of this run

  # ─────────────────────────── Stage 3 + 4 ───────────────────────────
  # Runtime smoke (container-level assertions) and browser functional
  # tests (Playwright) against the same running container. Combined into
  # one job so the container is only started once.
  test:
    name: "Stage 3+4: runtime smoke & browser tests"
    needs: build-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - run: docker load --input /tmp/budgettracker.tar

      # Start the container with the exact hardening flags from
      # docker-compose.yml (3.5-3.8 depend on these actually being applied,
      # not just declared in a file nobody runs).
      - name: Start container (docker-compose.yml flags, non-root + read-only)
        run: |
          docker run -d --name budgettracker-ci \
            --read-only \
            --tmpfs /tmp --tmpfs /var/cache/nginx --tmpfs /var/run \
            --security-opt no-new-privileges:true \
            -p 8080:8080 \
            budgettracker:ci

      - name: "Stage 3: runtime smoke"
        run: bash tests/smoke.sh http://localhost:8080 --target=container --container=budgettracker-ci

      - name: Container logs (on failure)
        if: failure()
        run: docker logs budgettracker-ci

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: "Stage 4: browser functional tests (Playwright)"
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Stop container
        if: always()
        run: docker rm -f budgettracker-ci
